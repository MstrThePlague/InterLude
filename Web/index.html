<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InterLude</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6e6e73; --accent: #d1345b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #f2f2f4; --muted: #9a9aa0; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { width: min(360px, 100% - 32px); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 999px;
           padding: 12px 32px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 16px; min-height: 1.4em; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>InterLude</h1>
  <p>6 Music, a minute behind live</p>
  <button id="play">Play</button>
  <div id="status"></div>
  <audio id="audio" preload="none"></audio>
</main>
<!-- A stand-in until milestone 3 grows the phone remote into the web app. -->
<script src="hls.min.js"></script>
<script>
  const src = 'stream/live.m3u8';
  const audio = document.getElementById('audio');
  const button = document.getElementById('play');
  const status = document.getElementById('status');
  let hls = null;

  function stop() {
    audio.pause();
    if (hls) { hls.destroy(); hls = null; }
    audio.removeAttribute('src'); audio.load();
    button.textContent = 'Play'; status.textContent = '';
  }

  // The first request for the playlist starts the session, which takes 20 s or so to fill its delay. Make it when the
  // page opens, so Play can start the audio straight from the click, as phones require.
  async function warm() {
    button.disabled = true;
    status.textContent = 'Starting…';
    try {
      const r = await fetch(src, { cache: 'no-store' });
      if (!r.ok) throw new Error(await r.text());
      status.textContent = '';
    } catch (e) { status.textContent = 'Couldn’t start: ' + e.message; }
    button.disabled = false;
  }

  function play() {
    button.textContent = 'Stop';
    if (audio.canPlayType('application/vnd.apple.mpegurl')) {
      audio.src = src;
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ manifestLoadingMaxRetry: 10, manifestLoadingRetryDelay: 2000 });
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { status.textContent = 'Playback failed: ' + d.details; } });
      hls.loadSource(src);
      hls.attachMedia(audio);
    } else {
      status.textContent = 'This browser can’t play HLS.';
      return;
    }
    audio.play().catch(e => { status.textContent = e.message; });
  }

  audio.addEventListener('playing', () => { status.textContent = 'Playing'; });
  audio.addEventListener('waiting', () => { status.textContent = 'Buffering…'; });
  button.addEventListener('click', () => button.textContent === 'Play' ? play() : stop());
  warm();
</script>
</body>
</html>
