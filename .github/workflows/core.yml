# The portable core and adapters must keep building away from the Mac: tests on Linux, a compile on Windows.
# The Mac app and its tests need macOS 26 and are built locally with scripts/build-app.sh.
name: Core

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: swift test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - run: swift build --target InterLudeCore
      - run: swift build --target InterLudePortable
